steps:
  - id: build-backend
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file
      - backend/Dockerfile
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/workout-journal-backend:$COMMIT_SHA
      - .

  - id: build-frontend
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file
      - frontend/Dockerfile
      - --build-arg
      - NEXT_PUBLIC_SUPABASE_URL=${_NEXT_PUBLIC_SUPABASE_URL}
      - --build-arg
      - NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${_NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/workout-journal-frontend:$COMMIT_SHA
      - .

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/workout-journal-backend:$COMMIT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/workout-journal-frontend:$COMMIT_SHA

options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _REGION: REPLACE_WITH_REGION
  _AR_REPOSITORY: REPLACE_WITH_REPOSITORY
  _NEXT_PUBLIC_SUPABASE_URL: ""
  _NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ""
