name: Dedicated candidate E2E

on:
  workflow_call:
    inputs:
      manifest:
        required: true
        type: string
      manifest_hash:
        required: true
        type: string
    outputs:
      e2e_hash:
        value: ${{ jobs.e2e.outputs.e2e_hash }}

permissions: {}

jobs:
  e2e:
    if: github.repository == 'tyosu131/Workout-Journal' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && vars.CD_C1_ACTIVATION == 'approved'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    outputs:
      e2e_hash: ${{ steps.e2e.outputs.e2e_hash }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Install locked E2E tooling before Google authentication
        run: |
          npm ci --ignore-scripts
          ./node_modules/.bin/playwright install --with-deps chromium
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: workout-journal-506909
          workload_identity_provider: projects/437413312066/locations/global/workloadIdentityPools/github-actions/providers/workout-journal-e2e
          service_account: workout-journal-e2e@workout-journal-506909.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true
          cleanup_credentials: true
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: '>= 416.0.0'
      - name: Exact secret read, private stdin, candidate scenario and exact-user cleanup
        id: e2e
        env:
          CD_C1_ACTIVATION: ${{ vars.CD_C1_ACTIVATION }}
          CD_MANIFEST: ${{ inputs.manifest }}
          CD_MANIFEST_HASH: ${{ inputs.manifest_hash }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -B .github/scripts/candidate_e2e.py
