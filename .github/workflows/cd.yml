name: Gated candidate delivery and isolated WIF proof

# Automatic candidates follow exact-main CI. Production still requires Environment approval.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: Authentication proof only, or separately activated release
        required: true
        type: choice
        default: wif-proof
        options:
          - wif-proof
          - release
      e2e_secret_version:
        description: Human-approved numeric version of the dedicated E2E secret
        required: false
        type: string

permissions: {}

concurrency:
  # Ineligible completions cannot displace a valid pending release. Not a FIFO queue.
  group: >-
    ${{ (github.repository == 'tyosu131/Workout-Journal' && github.repository_id == '790375516' && github.repository_owner_id == '95160728' && github.ref == 'refs/heads/main' && ((github.event_name == 'workflow_dispatch' && (inputs.mode == 'wif-proof' || (inputs.mode == 'release' && vars.CD_C1_ACTIVATION == 'approved'))) || (github.event_name == 'workflow_run' && github.event.action == 'completed' && github.event.workflow_run.name == 'CI' && github.event.workflow_run.workflow_id == 286209592 && github.event.workflow_run.path == '.github/workflows/ci.yml' && github.event.workflow_run.event == 'push' && github.event.workflow_run.status == 'completed' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == 'tyosu131/Workout-Journal' && github.event.workflow_run.head_repository.id == 790375516 && github.event.workflow_run.id > 0 && github.event.workflow_run.run_attempt > 0 && github.event.workflow_run.head_sha == github.sha && github.event.workflow_run.head_sha == github.workflow_sha))) && 'workout-journal-production-delivery' || github.run_id }}
  cancel-in-progress: false

env:
  CD_C1_ACTIVATION: ${{ vars.CD_C1_ACTIVATION }}
  GCP_PROJECT: workout-journal-506909
  WIF_PROVIDER: projects/437413312066/locations/global/workloadIdentityPools/github-actions/providers/workout-journal
  DEPLOY_SERVICE_ACCOUNT: workout-journal-deploy@workout-journal-506909.iam.gserviceaccount.com
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  wif-control-negative:
    if: github.repository == 'tyosu131/Workout-Journal' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.mode == 'wif-proof'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Deploy control then expected E2E impersonation denial
        env:
          CD_MODE: manual-wif-proof
        run: python3 -B .github/scripts/e2e_wif_proof.py control-negative

  wif-positive:
    needs: wif-control-negative
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'wif-proof'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/candidate-e2e.yml
    with:
      mode: manual-wif-proof

  preflight:
    if: >-
      github.repository == 'tyosu131/Workout-Journal' && github.repository_id == '790375516' && github.repository_owner_id == '95160728' && github.ref == 'refs/heads/main' && ((github.event_name == 'workflow_dispatch' && inputs.mode == 'release' && vars.CD_C1_ACTIVATION == 'approved') || (github.event_name == 'workflow_run' && github.event.action == 'completed' && github.event.workflow_run.name == 'CI' && github.event.workflow_run.workflow_id == 286209592 && github.event.workflow_run.path == '.github/workflows/ci.yml' && github.event.workflow_run.event == 'push' && github.event.workflow_run.status == 'completed' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == 'tyosu131/Workout-Journal' && github.event.workflow_run.head_repository.id == 790375516 && github.event.workflow_run.id > 0 && github.event.workflow_run.run_attempt > 0 && github.event.workflow_run.head_sha == github.sha && github.event.workflow_run.head_sha == github.workflow_sha))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      mode: ${{ steps.check.outputs.mode }}
      source_sha: ${{ steps.check.outputs.source_sha }}
      ci_run_id: ${{ steps.check.outputs.ci_run_id }}
      ci_run_attempt: ${{ steps.check.outputs.ci_run_attempt }}
      e2e_secret_version: ${{ steps.check.outputs.e2e_secret_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Exact main and successful required CI authority
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B .github/scripts/cd_release.py preflight

  candidate:
    needs: preflight
    if: needs.preflight.outputs.mode == 'manual-release' || needs.preflight.outputs.mode == 'automatic-release'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
      id-token: write
    outputs:
      manifest: ${{ steps.candidate.outputs.manifest }}
      manifest_hash: ${{ steps.candidate.outputs.manifest_hash }}
    env:
      CD_MODE: ${{ needs.preflight.outputs.mode }}
      CD_SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
      CD_CI_RUN_ID: ${{ needs.preflight.outputs.ci_run_id }}
      CD_CI_RUN_ATTEMPT: ${{ needs.preflight.outputs.ci_run_attempt }}
      E2E_SECRET_VERSION: ${{ needs.preflight.outputs.e2e_secret_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Prepare credential-free exact-source archive
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: python3 -B .github/scripts/cd_release.py prepare
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: workout-journal-506909
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true
          cleanup_credentials: true
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: '>= 416.0.0'
      - name: Build once, deploy unique zero-traffic pair, capture actual manifest
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: python3 -B .github/scripts/cd_release.py candidate

  candidate-e2e:
    needs: [preflight, candidate]
    if: needs.preflight.outputs.mode == 'manual-release' || needs.preflight.outputs.mode == 'automatic-release'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/candidate-e2e.yml
    with:
      mode: ${{ needs.preflight.outputs.mode }}
      source_sha: ${{ needs.preflight.outputs.source_sha }}
      ci_run_id: ${{ needs.preflight.outputs.ci_run_id }}
      ci_run_attempt: ${{ needs.preflight.outputs.ci_run_attempt }}
      e2e_secret_version: ${{ needs.preflight.outputs.e2e_secret_version }}
      manifest: ${{ needs.candidate.outputs.manifest }}
      manifest_hash: ${{ needs.candidate.outputs.manifest_hash }}

  verify-candidate:
    needs: [preflight, candidate, candidate-e2e]
    if: needs.preflight.outputs.mode == 'manual-release' || needs.preflight.outputs.mode == 'automatic-release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    outputs:
      e2e_hash: ${{ steps.verify.outputs.e2e_hash }}
    env:
      CD_MODE: ${{ needs.preflight.outputs.mode }}
      CD_SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
      CD_CI_RUN_ID: ${{ needs.preflight.outputs.ci_run_id }}
      CD_CI_RUN_ATTEMPT: ${{ needs.preflight.outputs.ci_run_attempt }}
      E2E_SECRET_VERSION: ${{ needs.preflight.outputs.e2e_secret_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: workout-journal-506909
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true
          cleanup_credentials: true
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: '>= 416.0.0'
      - name: Re-read candidate and production after E2E cleanup
        id: verify
        env:
          CD_MANIFEST: ${{ needs.candidate.outputs.manifest }}
          CD_MANIFEST_HASH: ${{ needs.candidate.outputs.manifest_hash }}
          CD_E2E_HASH: ${{ needs.candidate-e2e.outputs.e2e_hash }}
        run: python3 -B .github/scripts/cd_release.py verify

  production:
    needs: [preflight, candidate, verify-candidate]
    if: needs.preflight.outputs.mode == 'manual-release' || needs.preflight.outputs.mode == 'automatic-release'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      CD_MODE: ${{ needs.preflight.outputs.mode }}
      CD_SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
      CD_CI_RUN_ID: ${{ needs.preflight.outputs.ci_run_id }}
      CD_CI_RUN_ATTEMPT: ${{ needs.preflight.outputs.ci_run_attempt }}
      E2E_SECRET_VERSION: ${{ needs.preflight.outputs.e2e_secret_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: workout-journal-506909
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true
          cleanup_credentials: true
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: '>= 416.0.0'
      - name: Recheck captured production, CAS promotion, post-deploy and safe rollback
        env:
          GH_TOKEN: ${{ github.token }}
          CD_MANIFEST: ${{ needs.candidate.outputs.manifest }}
          CD_MANIFEST_HASH: ${{ needs.candidate.outputs.manifest_hash }}
          CD_E2E_HASH: ${{ needs.verify-candidate.outputs.e2e_hash }}
        run: python3 -B .github/scripts/cd_release.py promote
